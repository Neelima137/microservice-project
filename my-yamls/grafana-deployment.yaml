apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: monitoring 
  labels:
    app: grafana
spec:
  replicas: 1
  selector:
    matchLabels:
      app: grafana
  template:
    metadata:
      labels:
        app: grafana
    spec:
      containers:
      - name: grafana
        image: grafana/grafana:latest  #https://hub.docker.com/r/grafana/grafana
        ports:
        - containerPort: 3000


        #password : grafana
        
